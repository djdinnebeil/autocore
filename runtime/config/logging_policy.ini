# disable_all = on | off
# directory = relative or absolute path
# write_logs_to_files = on | off
# write_logs_to_console = on | off
# log_print_mode = log | print
# component_logging_default = on | off

[logging]
disable_all = off
directory = logs
write_logs_to_files = on
write_logs_to_console = off
log_print_mode = print
component_logging_default = on
